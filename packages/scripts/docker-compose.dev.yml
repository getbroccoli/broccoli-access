# Development stack, layered on docker-compose.yml by `pnpm dev` (packages/scripts/dev.sh),
# which installs node_modules on the host first. Relative paths resolve from the repository root.

x-dev-service: &dev-service
  image: node:24.21.0-bookworm
  # The host user, so files written to the checkout (routeTree.gen.ts) stay theirs.
  user: ${HOST_UID:?Start the development stack with pnpm dev}:${HOST_GID:?Start the development stack with pnpm dev}
  init: true
  volumes:
    - .:/repo

services:
  # The production images do not run in development.
  broccoli-access:
    profiles: [self-host]

  ready:
    profiles: [self-host]

  connectors:
    profiles: [self-host]

  postgres:
    volumes:
      - dev-postgres-data:/var/lib/postgresql

  api:
    <<: *dev-service
    working_dir: /repo/packages/api
    # Modules read their SDL at startup, so a changed .graphql file restarts the API too.
    command: [node_modules/.bin/tsx, watch, --include, "src/**/*.graphql", src/main.ts]
    environment:
      DATABASE_URL: postgres://broccoli_access@postgres:5432/broccoli_access
      LOG_LEVEL: ${LOG_LEVEL:-}
      # In the checkout, so the host user owns it.
      DATA_DIR: /repo/.data
      SELF_HOSTED_PUBLIC_URL: ""
      GOOGLE_OPENID_CONFIGURATION_URL: http://fake-google:4000/.well-known/openid-configuration
      GOOGLE_ADMIN_API_URL: http://fake-google:4000
      CONNECTORS_URL: http://fake-connectors:4000
    depends_on:
      postgres:
        condition: service_healthy

  # Google with the demo company Acme (docs/fake-apps.md): the API reaches it as fake-google,
  # browsers on the host port. A restart resets it to the seed.
  fake-google:
    <<: *dev-service
    working_dir: /repo/packages/fake-apps
    command: [node_modules/.bin/tsx, watch, src/main.ts]
    environment:
      FAKE_GOOGLE_BROWSER_URL: http://localhost:${HOST_FAKE_GOOGLE_PORT:?Start the development stack with pnpm dev}
      FAKE_GOOGLE_SERVER_URL: http://fake-google:4000
      FAKE_GOOGLE_REDIRECT_URIS: http://localhost:${HOST_WEB_PORT:?Start the development stack with pnpm dev}/api/google/callback
    ports:
      # Localhost only: the control endpoints have no authentication.
      - 127.0.0.1:${HOST_FAKE_GOOGLE_PORT:?Start the development stack with pnpm dev}:4000
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:4000/.well-known/openid-configuration]
      interval: 2s
      timeout: 3s
      start_period: 60s

  # The connectors container faked with Acme's Slack and Linear (docs/fake-apps.md): the API
  # reaches it as fake-connectors, browsers the Slack sign-in page on the host port. A restart
  # resets it to the seed.
  fake-connectors:
    <<: *dev-service
    working_dir: /repo/packages/fake-apps
    command: [node_modules/.bin/tsx, watch, src/connectorsMain.ts]
    ports:
      # Localhost only: the control endpoints have no authentication. HOST_FAKE_CONNECTORS_PORT pins it.
      - 127.0.0.1:${HOST_FAKE_CONNECTORS_PORT:-0}:4000
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:4000/v1/connectors]
      interval: 2s
      timeout: 3s
      start_period: 60s

  # `pnpm dev` configures fresh instances to send here before it prints the ready address.
  mailpit:
    image: axllent/mailpit:v1.31.4
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      # Localhost only, like the dev server.
      - 127.0.0.1:${HOST_MAILPIT_PORT:-0}:8025

  web:
    <<: *dev-service
    working_dir: /repo/packages/web
    command: [node_modules/.bin/vite]
    environment:
      API_PROXY_TARGET: http://api:3000
      # Host edits do not always produce file events through Docker's bind mount.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    ports:
      # pnpm dev picks a free port, so worktrees never collide. Localhost only: the dev server has
      # no authentication.
      - 127.0.0.1:${HOST_WEB_PORT:?Start the development stack with pnpm dev}:5173
    # Ready once the API answers through the Vite proxy.
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:5173/readyz]
      interval: 2s
      timeout: 3s
      start_period: 60s

volumes:
  # Development data stays apart from the production image's postgres-data.
  dev-postgres-data:
    labels:
      # `pnpm dev:prune` removes this project once the checkout folder is gone.
      org.getbroccoli.access.checkout: ${BROCCOLI_ACCESS_CHECKOUT:?Start the development stack with pnpm dev}
