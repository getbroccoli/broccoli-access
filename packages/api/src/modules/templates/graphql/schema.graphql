"A named list of apps that the owner assigns to people."
type Template {
  id: ID!
  "Unique, compared without case."
  name: String!
  createdAt: DateTime!
  "Its apps, in the order they were added."
  apps: [TemplateApp!]!
  "How many people have it."
  peopleCount: Int!
  "The differences of this template's current members; null when there are none."
  differenceSummary: TemplateDifferenceSummary
  "The employees who have this template, in assignment order."
  people(first: Int, after: String): EmployeeConnection!
}

type TemplateDifferenceSummary {
  missingCount: Int!
  extraCount: Int!
}

"One app in one template."
type TemplateApp {
  "Role key, or null for the app’s default."
  role: String
  "This listing's own id, not the app's."
  id: ID!
}

type TemplateEdge {
  cursor: String!
  node: Template!
}

type TemplateConnection {
  edges: [TemplateEdge!]!
  pageInfo: PageInfo!
}

input TemplateCreateInput {
  "Unique, compared without case; 1 to 100 characters once trimmed."
  name: String!
}

"The fields to change; a field left out stays as it is, and null clears a field that may be empty."
input TemplateUpdateInput {
  id: ID!
  "Unique, compared without case; 1 to 100 characters once trimmed. It cannot be empty, so null is refused."
  name: String
}

input TemplateDeleteInput {
  id: ID!
}

input TemplateAddAppInput {
  "The template."
  id: ID!
  "The id of one of the company's approved apps."
  appId: ID!
}

input TemplateTakeOutAppInput {
  "The template."
  id: ID!
  "The app's own id (`TemplateApp.app.id`)."
  appId: ID!
}

type Employee {
  "Templates assigned to this person, in stable template ID order."
  templates(first: Int, after: String): TemplateConnection!
  "Every app given by a template or choice, every account, and the connected apps offering Invite."
  personApps(first: Int, after: String): PersonAppConnection!
}

type PersonAppEdge {
  cursor: String!
  node: PersonApp!
}
type PersonAppConnection {
  edges: [PersonAppEdge!]!
  pageInfo: PageInfo!
}

type PersonApp {
  "Active if any counted account is active, Suspended if every counted account is suspended, null if none counts."
  accountStatus: AppAccountStatus
  "The templates that list this app for this employee."
  templates: [Template!]!
  "Whether the owner still has to settle different template roles."
  roleConflict: Boolean!
  "The template and role behind each option in an unresolved conflict."
  roleSources: [TemplateRoleSource!]!
  "The role given by the templates or picked by the owner, or null for the default or a conflict."
  role: String
  "The owner's own choice for this person, while it changes what they should have or keeps an active account Extra; null otherwise."
  choice: PersonAppChoice
  "Expected access compared with the held account: active access is Active or Extra, a pending invitation is Invited, and an expected app without either is Missing, even for a disabled account. Other disabled accounts are Suspended. Null for invitation controls alone, and for an app removed for this person that they have no account or pending invitation in. Employee.appAccounts supplies the underlying account status and actions."
  state: PersonAppState
}

enum PersonAppChoice {
  "The owner gave this person the app though none of their templates gives it."
  ADDED_FOR_PERSON
  "The owner kept the app from this person though a template of theirs gives it."
  REMOVED_FOR_PERSON
}

type TemplateRoleSource {
  template: Template!
  role: String
}

enum PersonAppState {
  ACTIVE
  SUSPENDED
  MISSING
  INVITED
  EXTRA
}

input TemplateAssignInput {
  id: ID!
  employeeId: ID!
}
input TemplateTakeOffInput {
  id: ID!
  employeeId: ID!
}

type TemplateAssignPayload {
  template: Template
  error: TemplateAssignError
}
union TemplateAssignError = InvalidInputError | NotFoundError
type TemplateTakeOffPayload {
  template: Template
  error: TemplateTakeOffError
}
union TemplateTakeOffError = NotFoundError

input TemplateSetAppRoleInput {
  id: ID!
  appId: ID!
  "Null selects the app's default."
  role: String
}

input TemplatePickRoleInput {
  employeeId: ID!
  appId: ID!
  "One of the conflicting template roles, including null for the default."
  role: String
}

input PersonAppAddInput {
  employeeId: ID!
  "The id of one of the company's approved apps that none of the person's templates gives."
  appId: ID!
  "A role key of the app's connector; left out or null for the app's default."
  role: String
}

input PersonAppRemoveInput {
  employeeId: ID!
  "The id of an app that one of the person's templates gives."
  appId: ID!
}

input PersonAppUndoChoiceInput {
  employeeId: ID!
  appId: ID!
}

"The person, who should now have the app, or why it was refused. No account changes."
type PersonAppAddPayload {
  employee: Employee
  error: PersonAppAddError
}
union PersonAppAddError = InvalidInputError | NotFoundError | ConflictError

"The person, who should no longer have the app, or why it was refused. Their account in it stays."
type PersonAppRemovePayload {
  employee: Employee
  error: PersonAppRemoveError
}
union PersonAppRemoveError = InvalidInputError | NotFoundError | ConflictError

"The person, with the choice for this one app cleared, or why it was refused. No account changes."
type PersonAppUndoChoicePayload {
  employee: Employee
  error: PersonAppUndoChoiceError
}
union PersonAppUndoChoiceError = InvalidInputError | NotFoundError

input ExtraAppKeepInput {
  employeeId: ID!
  appId: ID!
}

"The person who should now have the app, or why Keep was refused."
type ExtraAppKeepPayload {
  employee: Employee
  error: ExtraAppKeepError
}
union ExtraAppKeepError = InvalidInputError | NotFoundError | ConflictError

"The differences between the workspace's expected and actual access, one per person and app."
type AccessDifferences {
  missingCount: Int!
  extraCount: Int!
  runningChangeCount: Int!
  missing: [AccessDifference!]!
  extra: [AccessDifference!]!
}

"One person's missing or extra app."
type AccessDifference {
  employee: Employee!
  "The source of this Extra difference, when the row is Extra."
  reason: String
}

type TemplateSetAppRolePayload {
  template: Template
  error: TemplateSetAppRoleError
}
union TemplateSetAppRoleError = InvalidInputError | NotFoundError

type TemplatePickRolePayload {
  "The saved role key, or null for the app default."
  role: String
  error: TemplatePickRoleError
}
union TemplatePickRoleError = InvalidInputError | NotFoundError | ConflictError

type TemplatesMutations {
  "Keep an extra app for this person. Owner only."
  keepExtraApp(input: ExtraAppKeepInput!): ExtraAppKeepPayload!
  "Sets the invite role on an app already in this template. Admins only."
  setAppRole(input: TemplateSetAppRoleInput!): TemplateSetAppRolePayload!
  "Settles a role conflict for this person and app. Owner only."
  pickRole(input: TemplatePickRoleInput!): TemplatePickRolePayload!
  "Says one person should have an app that none of their templates gives; no template or account changes. Owner only."
  addPersonApp(input: PersonAppAddInput!): PersonAppAddPayload!
  "Says one person should not have an app a template of theirs gives; no template or account changes. Owner only."
  removePersonApp(input: PersonAppRemoveInput!): PersonAppRemovePayload!
  "Clears the addition or removal of one app for one person; without such a choice it changes nothing. Owner only."
  undoPersonAppChoice(input: PersonAppUndoChoiceInput!): PersonAppUndoChoicePayload!
  "Gives this template to a person active in the directory. Owner only."
  assign(input: TemplateAssignInput!): TemplateAssignPayload!
  "Takes this template off the employee. Owner only."
  takeOff(input: TemplateTakeOffInput!): TemplateTakeOffPayload!
  "Adds a template without apps. Admins only."
  create(input: TemplateCreateInput!): TemplateCreatePayload!
  "Renames a template. Admins only."
  update(input: TemplateUpdateInput!): TemplateUpdatePayload!
  "Deletes a template, its list of apps and its assignments to people; the apps themselves and every account stay. Admins only."
  delete(input: TemplateDeleteInput!): TemplateDeletePayload!
  "Adds an approved app to a template; an app already in it changes nothing. Admins only."
  addApp(input: TemplateAddAppInput!): TemplateAddAppPayload!
  "Takes an app out of a template; an app that is not in it changes nothing. Admins only."
  takeOutApp(input: TemplateTakeOutAppInput!): TemplateTakeOutAppPayload!
}

"The new template, or why it was refused."
type TemplateCreatePayload {
  template: Template
  error: TemplateCreateError
}

union TemplateCreateError = InvalidInputError

"The changed template, or why the change was refused."
type TemplateUpdatePayload {
  template: Template
  error: TemplateUpdateError
}

union TemplateUpdateError = InvalidInputError | NotFoundError

"Why the template was not deleted; null once it is."
type TemplateDeletePayload {
  error: TemplateDeleteError
}

union TemplateDeleteError = NotFoundError

"The template with the app in it, or why it was refused."
type TemplateAddAppPayload {
  template: Template
  error: TemplateAddAppError
}

union TemplateAddAppError = InvalidInputError | NotFoundError

"The template without the app, or why it was refused."
type TemplateTakeOutAppPayload {
  template: Template
  error: TemplateTakeOutAppError
}

union TemplateTakeOutAppError = NotFoundError

# Each module declares its own root fields; the server merges them into one type.
type Query {
  "The workspace's missing and extra apps. Admins only."
  accessDifferences: AccessDifferences!
  "One template; null when there is none. Admins only."
  template(id: ID!): Template
  "Templates by name, one page at a time. Admins only."
  templates(
    "Page size, 1 to 10000."
    first: Int = 100
    after: String
    "Exclude templates already assigned to this employee."
    assignableTo: ID
  ): TemplateConnection!
}

type Mutation {
  templates: TemplatesMutations!
}
