"Someone who works for the company."
type Employee implements AnyRecord {
  id: ID!
  firstName: String!
  lastName: String!
  "Work email, lowercased; unique."
  email: String!
  "Path of the employee's avatar, such as `/api/employees/avatar/<id>`; null without one."
  avatarUrl: String
  createdAt: DateTime!
  "Changes to this employee, newest first."
  history("Page size, 1 to 10000." first: Int = 50, after: String): RecordChangeConnection!
  "What the signed-in user may do to this employee."
  access: RecordAccess!
  "Their account's status in the directory, such as Google Workspace; null without one. Admins only."
  status: EmployeeStatus
  "Names of the approved apps, other than the directory, where they have an active account, sorted. Admins only."
  approvedAppNames: [String!]!
  "Suspended in the directory with an active account in another approved app. Admins only."
  suspendedWithAccess: Boolean!
}

"Whether someone's directory account, such as their Google Workspace account, is in use."
enum EmployeeStatus {
  ACTIVE
  SUSPENDED
}

# Adds the employee to the shared list of record types that keep history; the server merges them.
enum RecordType {
  EMPLOYEE
}

type EmployeeEdge {
  cursor: String!
  node: Employee!
}

type EmployeeConnection {
  edges: [EmployeeEdge!]!
  pageInfo: PageInfo!
}

enum EmployeeOrderField {
  "First name, then last name, ignoring case."
  NAME
  EMAIL
  "People suspended in the directory first, then by name; admins only."
  STATUS
}

input EmployeeOrder {
  field: EmployeeOrderField!
  direction: OrderDirection! = ASC
}

input EmployeeFilter {
  "Matches full name or email containing it, ignoring case; at most 100 characters."
  search: String
  "True keeps only the people suspended in the directory who still have an active account in another approved app; admins only."
  suspendedWithAccess: Boolean
}

"How many employees there are, and how many of them are suspended with access."
type EmployeeCounts {
  all: Int!
  "Suspended in the directory with an active account in another approved app."
  suspendedWithAccess: Int!
}

input EmployeeCreateInput {
  firstName: String!
  lastName: String!
  "Unique, compared without case."
  email: String!
}

"The fields to change; a field left out stays as it is, and null clears a field that may be empty."
input EmployeeUpdateInput {
  id: ID!
  firstName: String
  lastName: String
  "Unique, compared without case."
  email: String
  "Why the change is made, kept on the history line as its reason; at most 500 characters."
  changeReason: String
}

type EmployeesMutations {
  "Adds an employee. Admins only."
  create(input: EmployeeCreateInput!): EmployeeCreatePayload!
  "Changes an employee's fields and records the change in their history. Refused, naming each field, for a field the caller may not change; see `access`."
  update(input: EmployeeUpdateInput!): EmployeeUpdatePayload!
}

"The new employee, or why it was refused."
type EmployeeCreatePayload {
  employee: Employee
  error: EmployeeCreateError
}

union EmployeeCreateError = InvalidInputError

"The changed employee and the history line it added, or why the change was refused."
type EmployeeUpdatePayload {
  employee: Employee
  "The history line this update added; null when it changed nothing."
  historyLine: RecordChange
  error: EmployeeUpdateError
}

union EmployeeUpdateError = InvalidInputError | NotFoundError

# Adds the employee to an app's user; the server merges the types of the modules.
type AccountWithoutPerson {
  "The active directory employee whose name or email username (the part before @) resembles the account's, when there is one clear match."
  suggestedEmployee: Employee
}

type AppUser {
  "The employee whose account it is."
  employee: Employee!
}

# Adds the employee to an app invite; the server merges the types of the modules.
type AppInvite {
  "The employee it would invite."
  employee: Employee!
}

# Adds the person to an account change; the server merges the types of the modules.
type AccountChange {
  "The employee whose email is now the change's email; null when nobody has it."
  employee: Employee
}

# Adds the signed-in user's employee to `me`; the server merges the types.
type User {
  "The signed-in user's own employee record; null for a user without one, such as the owner."
  employee: Employee
}

# Each module declares its own root fields; the server merges them into one type.
type Query {
  "One employee; null when there is none."
  employee(id: ID!): Employee
  "Employees, one page at a time."
  employees(
    "Page size, 1 to 10000."
    first: Int = 100
    after: String
    orderBy: EmployeeOrder = { field: NAME, direction: ASC }
    filter: EmployeeFilter
  ): EmployeeConnection!
  "How many employees there are, and how many are suspended with access. Admins only."
  employeeCounts: EmployeeCounts!
}

type Mutation {
  employees: EmployeesMutations!
}
