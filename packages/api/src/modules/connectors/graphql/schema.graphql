"A connector of the connectors container, as its list describes it: the core shows and connects its app with no code for it."
type ContainerConnector {
  "Its key, such as `linear`."
  id: ID!
  name: String!
  "Its app's domain, such as `linear.app`."
  appDomain: String!
  "The finding kind of the accounts it finds, such as `linear_members`."
  findingKind: String!
  "What connecting asks for, in order."
  connectionFields: [ConnectionField!]!
  "Shown before the first connection, which the owner accepts; null for an API connector."
  notice: String
  "Whether Broccoli Access can sign in to its app as the integration user, so Connect offers that beside the owner's own session."
  signsInAsIntegrationUser: Boolean!
  "Whether Broccoli Access can disable and enable accounts through this connector."
  canDisableAccounts: Boolean!
  "Its connection; null until connected."
  connection: ContainerConnection
}

"One value connecting a container connector asks for."
type ConnectionField {
  key: String!
  kind: ConnectionFieldKind!
  label: String!
  help: String!
  "Whether it is stored encrypted and never shown again."
  secret: Boolean!
}

"How the owner gives a connection field's value."
enum ConnectionFieldKind {
  "Text the owner types or pastes, such as an API key."
  TEXT
  "The owner's session in the app, which the extension hands over."
  APP_SESSION
}

"An app connected through the connectors container."
type ContainerConnection {
  id: ID!
  "Where the owner manages the app's members, with the connection's settings filled in; null when they lack a value it names."
  adminUrl: String
  "When the owner accepted the connector's notice; null for a connector without one."
  noticeAcceptedAt: DateTime
  "Who made its app session; null for a connection without one, such as one with an API key."
  sessionFrom: AppSessionSource
  "Whether the connection signs in as the integration user while the directory's last scan found it suspended: its calls stop, and it shows Reconnect."
  integrationUserSuspended: Boolean!
  "The connector it connects through."
  connector: ContainerConnector!
}

"Who made a connection's app session."
enum AppSessionSource {
  "The owner's own session, which the extension handed over."
  EXTENSION
  "The integration user's session, which Broccoli Access made by signing in as it: the connection acts as the integration user."
  SERVER_SIGN_IN
}

"An app session the paired extension handed over, or the integration user's sign-in made, waiting for the owner to confirm its workspace and connect within five minutes."
type AppSessionHandOver {
  "The id the page gave the hand-over."
  id: ID!
  "The workspace the session opens, such as `Acme`."
  organizationName: String!
  "The workspace's address, such as `acme.slack.com`; null for an app without one."
  domain: String
  "The session, sealed so only this instance reads it; `connectors.connect` takes it back."
  appSession: String!
}

# Adds the connection to the apps module's App; the server merges the types of the modules.
type App {
  "Its connection through the connectors container; null for an app without one, and while the container has not listed its connectors since the API started."
  containerConnection: ContainerConnection
  "The container connector that can read its accounts: the one whose key is its catalog key; null when none can, such as for Google Workspace, and while the container has not listed its connectors since the API started."
  managingConnector: ContainerConnector
  "Whether setup selects this app by default. True when it has a managing connector."
  preselected: Boolean!
}

"An app a container connector can manage that no scan has found and nothing has connected, as the catalog names it; computed when read, never stored."
type AppToConnect {
  "Its catalog key, such as `linear`."
  id: ID!
  name: String!
  "Such as `linear.app`."
  domain: String!
  "The connector that connects it, whose key is its catalog key."
  connector: ContainerConnector!
}

input ContainerConnectorConnectInput {
  "The connector's key, such as `linear`."
  connector: ID!
  "A value for each of its text connection fields."
  values: [ConnectionFieldValue!]! = []
  "For a connector with an app session field: the `appSession` of its `AppSessionHandOver`, from the extension or from `connectWithIntegrationUser`."
  appSession: String
  "Whether the owner accepted the connector's notice; a connector with a notice needs it."
  noticeAccepted: Boolean! = false
}

input ConnectionFieldValue {
  key: String!
  value: String!
}

"The connected connector, or why connecting was refused."
type ContainerConnectorConnectPayload {
  containerConnector: ContainerConnector
  error: ContainerConnectorConnectError
}

union ContainerConnectorConnectError =
  | InvalidInputError
  | NotFoundError
  | ConflictError
  | UnavailableError

input ContainerConnectorReconnectInput {
  "The connected connector's key, such as `linear`."
  connector: ID!
  "A value for each of its text connection fields."
  values: [ConnectionFieldValue!]! = []
  "For a connector with an app session field: the `appSession` of a new `AppSessionHandOver`."
  appSession: String
}

"The reconnected connector, or why reconnecting was refused."
type ContainerConnectorReconnectPayload {
  containerConnector: ContainerConnector
  error: ContainerConnectorReconnectError
}

union ContainerConnectorReconnectError = InvalidInputError | NotFoundError | UnavailableError

input ContainerConnectorConnectWithIntegrationUserInput {
  "The key of a connector that signs in as the integration user, such as `slack`."
  connector: ID!
  "Whether the owner accepted the connector's notice; its first connection needs it."
  noticeAccepted: Boolean! = false
}

"What signing in as the integration user gave, or why it was refused."
type ContainerConnectorConnectWithIntegrationUserPayload {
  "For a connector not connected yet: the workspace the sign-in reached with its sealed session, which the owner confirms within five minutes through `connectors.connect` and its `appSession`; null after a switch."
  appSessionHandOver: AppSessionHandOver
  "The connector; its connection is null until the owner confirms a first connection."
  containerConnector: ContainerConnector
  error: ContainerConnectorConnectWithIntegrationUserError
}

union ContainerConnectorConnectWithIntegrationUserError =
  | InvalidInputError
  | NotFoundError
  | ConflictError
  | UnavailableError

type ConnectorsMutations {
  "Connects a container connector with typed values, or with the app session its extension handed over: tests them with the app, then saves the connection, approves its app and queues its first scan. Refused as invalid `noticeAccepted` without the connector's notice accepted, as invalid `values.<key>` for a missing or unknown value, as invalid `appSession` for a missing, changed, expired or another's session, and as invalid `values` or `appSession` with the error's code when the app refuses them; with a NotFoundError for a connector the container lacks, a ConflictError for one already connected, and an UnavailableError when the test fails otherwise. Admins only."
  connect(input: ContainerConnectorConnectInput!): ContainerConnectorConnectPayload!
  "Replaces the credentials of a container connector's connection, whether it is connected or needs reconnecting, with new typed values or the app session a new hand-over gave: tests them with the app, which must reach the connection's workspace, then saves them, sets it connected and queues its scan. Refused with an InvalidInputError: on `values.<key>` or `appSession` as `connect` refuses them; on `values` (typed values) or `appSession` (a hand-over) with the app's error code when the app refuses them, or with `wrong_workspace` when they reach another workspace than the connection's. Refused with a NotFoundError for a connector the container lacks or one not connected, and an UnavailableError when the test fails otherwise. Admins only."
  reconnect(input: ContainerConnectorReconnectInput!): ContainerConnectorReconnectPayload!
  "Signs in to a container connector's app as the integration user, which the owner invited there as an admin. For a connector not connected yet, nothing is stored: the payload's `appSessionHandOver` names the workspace the sign-in reached, and `connect` with its `appSession` connects it. On a connected connector it switches the connection to that session, which must open the same workspace, and queues its scan. Refused as invalid `noticeAccepted` for a first sign-in without the notice accepted, and as invalid `integrationUser` with a code the owner can act on: `not_invited`, `permission_missing`, `blocked_by_check`, `authentication_failed`, `wrong_workspace`, `scan_running` for a switch while the connection's scan runs, or `not_set_up` until the integration user signs in to Google with two steps. Refused with a NotFoundError for a connector the container lacks, a ConflictError for one that cannot sign in as the integration user, and an UnavailableError when signing in fails otherwise. Admins only."
  connectWithIntegrationUser(
    input: ContainerConnectorConnectWithIntegrationUserInput!
  ): ContainerConnectorConnectWithIntegrationUserPayload!
}

type Query {
  "The connectors container's connectors, in its order; empty without a container, and while it has not listed them since the API started. Admins only."
  containerConnectors: [ContainerConnector!]!
  "The apps a container connector can manage that have no app yet, in the container's order; empty without a container, and while it has not listed its connectors since the API started. Admins only."
  appsToConnect: [AppToConnect!]!
  "The caller's app session hand-over with this id, which their page gave the extension; null until the extension hands the session over, and after five minutes. Admins only."
  appSessionHandOver(id: ID!): AppSessionHandOver
}

type Mutation {
  connectors: ConnectorsMutations!
}
