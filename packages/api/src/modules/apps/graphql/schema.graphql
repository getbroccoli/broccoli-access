  edges: [MarkedAccountEdge!]!
  pageInfo: PageInfo!
}

input AppAccountMarkInput {
  appAccountId: ID!
  kind: MarkedAccountKind!
  "The owner’s note, at most 500 characters. Surrounding whitespace is trimmed. A note with nothing to read is refused."
  note: String!
}

input AppAccountNoteInput {
  appAccountId: ID!
  "The owner’s note, at most 500 characters. Surrounding whitespace is trimmed. A note with nothing to read is refused."
  note: String!
}

