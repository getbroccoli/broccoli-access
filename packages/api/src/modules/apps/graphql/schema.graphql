  appUser: AppUser
  error: AppAccountLinkError
}

union AppAccountLinkError = NotFoundError | ConflictError

type AppsMutations {
  "Saves a person and their template assignments. Provision creates their directory account later. Owner only."
  addPerson(input: AddPersonInput!): AddPersonPayload!
  "Deletes a person saved through Add person who has never had a directory account, has no linked accounts or direct reports, and has no running directory creation. Owner only."
  deletePerson(employeeId: ID!): DeletePersonPayload!
  "Returns the unread first password and its work email within seven days of creation, or null for both if none is available. Clears the copy stored here, leaving the Google password usable. Owner only."
  takeFirstPassword(employeeId: ID!): FirstPasswordPayload!
  "Marks a personal account eligible for accountsWithoutPerson with the owner's note. Owner only."
  markAccount(input: AppAccountMarkInput!): MarkedAccountPayload!
  "Edits the note of an account marked by the owner. Owner only."
  editAccountNote(input: AppAccountNoteInput!): MarkedAccountPayload!
  "Links an eligible account to an employee. The link survives a rescan of the same app and email. A new unmatched address needs a new link. Owner only."
  linkAccount(input: AppAccountLinkInput!): AppAccountLinkPayload!
  "Approves an app and records it in the app's history. Admins only."
  approve(input: AppApproveInput!): AppApprovePayload!
  "Ignores an app and records it in the app's history; refused with a ConflictError for a connected app, which stays approved. Admins only."
  ignore(input: AppIgnoreInput!): AppIgnorePayload!
  "Setup's last step: approves the selected discovered apps, ignores the others and finishes setup. Refused with a ConflictError at another step, and as invalid `approvedAppIds` for an id that is no discovered app. Admins only."
  finishSetup(input: SetupFinishInput!): SetupFinishPayload!
  "Disables, enables or removes an app account: queues the change, which runs on the server one per connection at a time, in the order asked, and returns the linked employee's appUser with it as its latest change; appUser is null for an unlinked account or one the change removed. Refused with a NotFoundError for an unknown account, and a ConflictError when the account does not offer this action now (`offeredChange` or `offersRemove`). Admins only."
  changeAccount(input: AppUserChangeInput!): AppUserChangePayload!
  "Invites an employee to an app they have no account in: queues the invite like a Disable, and returns their invite row with it as its latest invite. The app sends its own invitation; an email that already has a member or an invitation gets none. Refused with a NotFoundError for an unknown employee or app, and a ConflictError when the row does not offer Invite now (`offered`). Admins only."
  inviteEmployee(input: AppInviteInput!): AppInvitePayload!
  "Offboards an employee: queues a Disable, started from offboarding, for each of their active accounts that offers one in the apps of `appIds`, the directory's first, and takes their templates and app choices off. The plan lists remaining work in `byHandWork` and accounts eligible for Remove all in `accountsToRemove`. Refused with a NotFoundError for an unknown employee. Admins only."
  offboardEmployee(input: EmployeeOffboardInput!): EmployeeOffboardPayload!
  "Provisions the confirmed apps by Invite, Enable or work by hand. For a new person, only the owner can start creating their Google account, and the other apps wait for Google to confirm creation. Asking again while a change runs or waits writes no duplicate. Refuses an unknown employee or a role conflict in a confirmed app. Otherwise admins only."
  provisionEmployee(input: EmployeeProvisionInput!): EmployeeProvisionPayload!
  "Provision one app for the people confirmed in Differences. Each person's access is rechecked."
  provisionApp(input: AppProvisionInput!): AppProvisionPayload!
  "Queues a Remove for each of `accountIds` that is still in the employee's `accountsToRemove`, as a Remove of the account's own row does; an account that became removable since the owner looked is left alone. Refused with a NotFoundError for an unknown employee. Admins only."
  removeEmployeeAccounts(input: EmployeeRemoveAccountsInput!): EmployeeRemoveAccountsPayload!
  "I did it by hand: the owner reports making a failed change in the app themselves; Broccoli Access calls no app. The change becomes DONE_BY_HAND and the status Broccoli Access records for the account takes the new value at once, with a history line unless it already had that status; the next scan checks it. A removal immediately deletes the local account unless another source still finds it, in which case it remains listed as outside the app. A failed app invite becomes DONE_BY_HAND, which shows the employee Invited. For a Google Workspace directory creation, scan Google Workspace instead. Refused with a NotFoundError for an unknown change, and with a ConflictError unless the change failed and is the latest: its account's latest change, or for an invite, the latest invite of its connection and email, or in an app that still has no connection, of its app and person. Admins only."
  markAccountChangeDoneByHand(
    input: AccountChangeMarkDoneByHandInput!
  ): AccountChangeMarkDoneByHandPayload!
}

