"An application people use: found by a scan, or connected."
type App {
  id: ID!
  name: String!
  "Such as `slack.com`; null when unknown."
  domain: String
  "Its key in the built-in catalog, such as `slack`; null for an app the catalog lacks."
  catalogKey: String
  status: AppStatus!
  "How many people have an account in it."
  peopleCount: Int!
  "The finding kinds that saw its people's accounts, sorted, such as `google_sign_in`; connector modules register them."
  foundVia: [String!]!
  "The earliest Since of its people's accounts; null without people."
  since: Since
  "Whether setup's selection of the company's apps starts with it: at least a fifth of the directory's people have an account in it."
  preselected: Boolean!
  "How many of its people still have an active account in it though the directory suspended them."
  suspendedWithAccessCount: Int!
  "Whether a connection reads it; a connected app stays approved, so it cannot be ignored."
  connected: Boolean!
  "Its users: the accounts in it that belong to an employee, those whose employee the directory suspended first, then by name."
  users("Keeps only the first this many, at least 1; all when null." first: Int): [AppUser!]!
  "Whether it is connected through a connector that can disable and enable its accounts (`managingConnector` names one, connected or not); whether an account offers Disable or Enable now is its `offeredChange`."
  canChangeAccounts: Boolean!
}

"An account in an app that belongs to an employee."
type AppUser {
  id: ID!
  "Whether the person may use the account in the app."
  status: AppAccountStatus!
  "The finding kinds that saw the account, sorted, such as `google_sign_in`; connector modules register them."
  foundVia: [String!]!
  since: Since!
  "The app the account is in."
  app: App!
  "Whether it is the member whose key or session its app's connection uses, as the connection's last scan saw; Disable and Enable are never offered on it."
  isConnectionUser: Boolean!
  "SUSPEND (Disable) on an active account or REACTIVATE (Enable) on a suspended one, when the owner may ask for it now; null when the app's connection cannot change accounts or needs reconnecting, its last scan did not list the account, the account is the connection's user, or a change of it is running."
  offeredChange: AccountChangeAction
  "Its latest Disable or Enable; null before the first."
  latestChange: AccountChange
}

"One Disable or Enable of one app account, from the owner's click to its result."
type AccountChange {
  id: ID!
  action: AccountChangeAction!
  status: AccountChangeStatus!
  "While it runs: how many changes of its connection asked before it still run, which it waits for; null once it has finished."
  changesAhead: Int
  "When it stopped running; null while it runs."
  finishedAt: DateTime
  "The account's email, lowercased, copied when the owner asked; it stays after a scan deletes the account."
  email: String!
  "The account's app."
  app: App!
  requestedBy: AccountChangeRequester!
  requestedAt: DateTime!
  "Its last error; null unless FAILED or DONE_BY_HAND."
  failure: AccountChangeFailure
}

"The signed-in user who asked for an account change."
type AccountChangeRequester {
  "The user's id."
  id: ID!
  name: String!
}

"Why an account change failed: its last error."
enum AccountChangeFailure {
  "The app refused the connection's credentials, such as a revoked or expired token."
  AUTHENTICATION_FAILED
  "A permission or an admin right is missing."
  PERMISSION_MISSING
  "The app kept limiting requests after the change tried again."
  RATE_LIMITED
  "The app timed out or failed after the change tried again, the change could not run in time, or the connector no longer changes accounts."
  APP_UNAVAILABLE
  "The app answered something the connector does not understand, or the account did not read back with its new status."
  UNEXPECTED_RESPONSE
  "A CAPTCHA, bot check or MFA prompt stopped the connector."
  BLOCKED_BY_CHECK
  "No single member matched."
  ACCOUNT_NOT_FOUND
  "The key or session reaches another workspace than the connection's."
  WRONG_WORKSPACE
  "The app refused the change."
  NOT_ALLOWED
  "The owner's Chrome went away during the call."
  OWNER_BROWSER_LOST
}

type AccountChangeEdge {
  cursor: String!
  node: AccountChange!
}

type AccountChangeConnection {
  edges: [AccountChangeEdge!]!
  pageInfo: PageInfo!
}

"What an account change does in the app; the UI says Disable and Enable."
enum AccountChangeAction {
  "Disable: suspend the account."
  SUSPEND
  "Enable: make the account active again."
  REACTIVATE
}

"Where an account change is."
enum AccountChangeStatus {
  "Waiting for its turn, or running."
  RUNNING
  "The connector read the account's new status back."
  SUCCEEDED
  "Broccoli Access could not confirm the new status in the app; the saved account status did not change."
  FAILED
  "It had failed, and the owner made the change in the app themselves."
  DONE_BY_HAND
}

# Adds the person's app accounts to the employees module's Employee; the server merges the types.
type Employee {
  "Their accounts in approved apps other than the directory: the active ones, and the suspended ones in connected apps, by app name. Admins only."
  appAccounts: [AppUser!]!
}

"Since when someone has had an account, as far as the sources know: when they granted access; before the log began, for a grant older than the log; otherwise when a scan first saw the account."
type Since {
  at: DateTime!
  "The grant is older than the log, which began at `at`; false says nothing more about how exact `at` is."
  before: Boolean!
}

"Whether a person may use their account in an app."
enum AppAccountStatus {
  ACTIVE
  "Suspended in the app; a connected app shows it as Disabled."
  SUSPENDED
}

"Whether the company uses an app."
enum AppStatus {
  "Found by a scan; the owner has not decided yet."
  DISCOVERED
  "The owner says the company uses it, or it is connected."
  APPROVED
  "The owner set it aside."
  IGNORED
}

type AppEdge {
  cursor: String!
  node: App!
}

type AppConnection {
  edges: [AppEdge!]!
  pageInfo: PageInfo!
}

"How many apps have each status."
type AppCounts {
  approved: Int!
  discovered: Int!
  ignored: Int!
}

input AppApproveInput {
  id: ID!
}

input AppIgnoreInput {
  id: ID!
}

input AppUserChangeInput {
  "The app account's id, as its AppUser has it."
  id: ID!
  action: AccountChangeAction!
}

input AccountChangeMarkDoneByHandInput {
  "The account change's id."
  id: ID!
}

input SetupFinishInput {
  "The discovered apps the company uses; every other discovered app is ignored."
  approvedAppIds: [ID!]!
}

type AppsMutations {
  "Approves an app and records it in the app's history. Admins only."
  approve(input: AppApproveInput!): AppApprovePayload!
  "Ignores an app and records it in the app's history; refused with a ConflictError for a connected app, which stays approved. Admins only."
  ignore(input: AppIgnoreInput!): AppIgnorePayload!
  "Setup's last step: approves the selected discovered apps, ignores the others and finishes setup. Refused with a ConflictError at another step, and as invalid `approvedAppIds` for an id that is no discovered app. Admins only."
  finishSetup(input: SetupFinishInput!): SetupFinishPayload!
  "Disables or enables an app account in its app: queues the change, which runs on the server one per connection at a time, in the order asked, and returns the account with it as its latest change. Refused with a NotFoundError for an unknown account, and a ConflictError when the account does not offer this action now (`offeredChange`). Admins only."
  changeAccount(input: AppUserChangeInput!): AppUserChangePayload!
  "I did it by hand: the owner reports making a failed change in the app themselves; Broccoli Access calls no app. The change becomes DONE_BY_HAND and the status Broccoli Access records for the account takes the new value at once, with a history line unless it already had that status; the next scan checks it. Refused with a NotFoundError for an unknown change, and a ConflictError unless it failed and is its account's latest. Admins only."
  markAccountChangeDoneByHand(
    input: AccountChangeMarkDoneByHandInput!
  ): AccountChangeMarkDoneByHandPayload!
}

"The approved app, or why it was refused."
type AppApprovePayload {
  app: App
  error: AppApproveError
}

union AppApproveError = NotFoundError

"The ignored app, or why it was refused."
type AppIgnorePayload {
  app: App
  error: AppIgnoreError
}

union AppIgnoreError = NotFoundError | ConflictError

"The account with its change queued, or why the change was refused; the account is null for one that belongs to no employee."
type AppUserChangePayload {
  appUser: AppUser
  error: AppUserChangeError
}

union AppUserChangeError = NotFoundError | ConflictError

"The account with its change done by hand, or why it was refused; the account is null for one that belongs to no employee."
type AccountChangeMarkDoneByHandPayload {
  appUser: AppUser
  error: AccountChangeMarkDoneByHandError
}

union AccountChangeMarkDoneByHandError = NotFoundError | ConflictError

"Setup once finished, or why it was refused."
type SetupFinishPayload {
  setup: Setup
  error: SetupFinishError
}

union SetupFinishError = InvalidInputError | ConflictError

type Query {
  "One app; null when there is none. Admins only."
  app(id: ID!): App
  "The apps with a status, the most people first, one page at a time. Admins only."
  apps(status: AppStatus!, "Page size, 1 to 10000." first: Int = 100, after: String): AppConnection!
  "How many apps have each status. Admins only."
  appCounts: AppCounts!
  "Every Disable and Enable, newest first, one page at a time. Admins only."
  accountChanges("Page size, 1 to 10000." first: Int = 100, after: String): AccountChangeConnection!
}

type Mutation {
  apps: AppsMutations!
}
