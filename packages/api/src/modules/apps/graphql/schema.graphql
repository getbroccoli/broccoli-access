"An application people use: found by a scan, or connected."
type App {
  "Roles offered for an invite by this app's connected connector."
  roles: [AppRole!]!
  id: ID!
  name: String!
  "Such as `slack.com`; null when unknown."
  domain: String
  "Its key in the built-in catalog, such as `slack`; null for an app the catalog lacks."
  catalogKey: String
  status: AppStatus!
  "How many people have an account in it; once its connection has scanned, only the accounts that scan returned count."
  peopleCount: Int!
  "The first distinct people with access, as their accounts, in the same order as users."
  peoplePreview(first: Int!): [AppUser!]!
  "The finding kinds that saw its people's accounts, sorted, such as `google_sign_in`; connector modules register them."
  foundVia: [String!]!
  "The earliest Since of its people's accounts; null without people."
  since: Since
  "Whether setup's selection of the company's apps starts with it: at least a fifth of the directory's people have an account in it."
  preselected: Boolean!
  "How many of its people still have an active account in it though the directory suspended them."
  suspendedWithAccessCount: Int!
  "Whether a connection reads it; a connected app stays approved, so it cannot be ignored."
  connected: Boolean!
  "The accounts in it that belong to an employee: its users, those whose employee the directory suspended first, then by name; then those not in it (`inApp` false), which are not its users."
  users("Keeps only the first this many, at least 1; all when null." first: Int): [AppUser!]!
  "Whether it is connected through a connector that can change or remove its accounts (`managingConnector` names one, connected or not); whether an account offers Disable or Enable now is its `offeredChange`."
  canChangeAccounts: Boolean!
}

"An account in an app that belongs to an employee."
type AppUser {
  id: ID!
  "The account's email in the app, which may differ from the employee's work email."
  email: String!
  "Whether the person may use the account in the app."
  status: AppAccountStatus!
  "Whether its app's connection's last successful scan returned it; null when the app has no connection or none of its scans has succeeded yet, and the account counts as before. Only false excludes it: an account not in its app, such as one only a Google sign-in found, is no access whatever its status, and offers no change."
  inApp: Boolean
  "The finding kinds that saw the account, sorted, such as `google_sign_in`; connector modules register them."
  foundVia: [String!]!
  since: Since!
  "The app the account is in."
  app: App!
  "Whether it is the member whose key or session its app's connection uses, as the connection's last scan saw; Disable, Enable and Remove are never offered on it."
  isConnectionUser: Boolean!
  "SUSPEND (Disable) on an active account or REACTIVATE (Enable) on a suspended one, when the owner may ask for it now; null when the app's connection cannot change accounts or needs reconnecting, its last scan did not list the account, the account is the connection's user, or a change of it is running."
  offeredChange: AccountChangeAction
  "Whether this disabled member may also be removed from its app."
  offersRemove: Boolean!
  "Whether its row shows Reconnect instead of Disable or Enable: it would offer one, but its app's connection needs reconnecting."
  offersReconnect: Boolean!
  "Its latest Disable, Enable or Remove; null before the first."
  latestChange: AccountChange
}

"One Disable, Enable or Remove of one app account, or one Invite of an employee to an app, from the owner's click to its result."
type AccountChange {
  id: ID!
  action: AccountChangeAction!
  status: AccountChangeStatus!
  "While it runs: how many changes of its connection asked before it still run, which it waits for; null once it has finished."
  changesAhead: Int
  "When it stopped running; null while it runs."
  finishedAt: DateTime
  "The account's email, or the invited employee's, lowercased, copied when the owner asked; it stays after a scan deletes the account."
  email: String!
  "The account's app."
  app: App!
  requestedBy: AccountChangeRequester!
  requestedAt: DateTime!
  "Its last error; null unless FAILED or DONE_BY_HAND."
  failure: AccountChangeFailure
}

"The signed-in user who asked for an account change."
type AccountChangeRequester {
  "The user's id."
  id: ID!
  name: String!
}

"Why an account change failed: its last error."
enum AccountChangeFailure {
  "The app refused the connection's credentials, such as a revoked or expired token."
  AUTHENTICATION_FAILED
  "A permission or an admin right is missing."
  PERMISSION_MISSING
  "The app kept limiting requests after the change tried again."
  RATE_LIMITED
  "The app timed out or failed after the change tried again, the change could not run in time, or the connector no longer changes accounts."
  APP_UNAVAILABLE
  "The app answered something the connector does not understand, or the account did not read back with its new status."
  UNEXPECTED_RESPONSE
  "A CAPTCHA, bot check or MFA prompt stopped the connector."
  BLOCKED_BY_CHECK
  "No single member matched."
  ACCOUNT_NOT_FOUND
  "The key or session reaches another workspace than the connection's."
  WRONG_WORKSPACE
  "Broccoli Access or the app refused the change."
  NOT_ALLOWED
  "The owner's Chrome went away during the call."
  OWNER_BROWSER_LOST
}

type AccountChangeEdge {
  cursor: String!
  node: AccountChange!
}

type AccountChangeConnection {
  edges: [AccountChangeEdge!]!
  pageInfo: PageInfo!
}

"What an account change does in the app; the UI says Disable, Enable, Remove and Invite."
enum AccountChangeAction {
  "Remove a disabled member from the app."
  REMOVE
  "Disable: suspend the account."
  SUSPEND
  "Enable: make the account active again."
  REACTIVATE
  "Invite: the app sends its own invitation to the employee's email with their template role, or the app's default."
  INVITE
}

"Where an account change is."
enum AccountChangeStatus {
  "Waiting for its turn, or running."
  RUNNING
  "The connector verified the new status, the targeted member’s absence after Remove, or the invitation or member after Invite."
  SUCCEEDED
  "Broccoli Access could not confirm the change in the app; the saved account status did not change."
  FAILED
  "It had failed, and the owner made the change in the app themselves."
  DONE_BY_HAND
}

# Adds the app and the status to the connectors module's connections; the server merges the types.
type ContainerConnection {
  "The app it connects."
  app: App!
  status: AppConnectionStatus!
  "Why it needs reconnecting and what found it; null while connected."
  reconnectReason: ReconnectReason
}

"Whether a connection works."
enum AppConnectionStatus {
  CONNECTED
  "Its key or session stopped working; changes in its app fail until the owner reconnects it."
  RECONNECT
}

"Why a connection needs reconnecting, and what found it."
type ReconnectReason {
  cause: ReconnectCause!
  "When a scan or an account change found it."
  foundAt: DateTime!
  "The Disable, Enable, Remove or Invite that found it; null when a scan did."
  foundByChange: AccountChange
}

"The connector error that turned a connection to Reconnect."
enum ReconnectCause {
  "The app refused the key or session: revoked, expired or signed out."
  AUTHENTICATION_FAILED
  "The connection's user is no longer an admin in the app."
  PERMISSION_MISSING
  "The key or session reaches another workspace than the connection's."
  WRONG_WORKSPACE
}

# Adds the person's app accounts and invites to the employees module's Employee; the server merges the types.
type Employee {
  "Their accounts in approved apps other than the directory, leaving out those not in their app (`inApp` false): the active ones, and the suspended ones in connected apps, by app name. Admins only."
  appAccounts: [AppUser!]!
  "The connected apps whose last scan found neither their work email nor a member the owner linked to them, where Invite or Reconnect is offered, an invite was asked, or a scan read their pending invitation, also in an app whose connection cannot invite, by app name. Admins only."
  appInvites: [AppInvite!]!
}

"An employee's row for a connected app they have no account in: Invite offered, their invite running, done or failed, or Invited by a pending invitation a scan read in the app, whoever sent it."
type AppInvite {
  "Unique per employee and app."
  id: ID!
  app: App!
  "Whether an invite is accepted now: the employee is active in the directory, the app's connection is connected, no invite runs and they are not invited. After a failed invite, the row shows Try again only where trying again can help."
  offered: Boolean!
  "Whether its row shows Reconnect instead of Invite: it would offer one, but the app's connection needs reconnecting."
  offersReconnect: Boolean!
  "When the employee was invited, while the row shows Invited; null otherwise. Where the app's scans read its pending invitations: the date of the employee's invitation as the app gives it, whoever sent it, else when a scan first saw it; or the finish of an invite that succeeded or was done by hand since the last scan. Elsewhere: the finish of the latest invite once it succeeded or was done by hand. The next scan that finds their member ends the row."
  invitedAt: DateTime
  "The latest invite asked in Broccoli Access; null before the first. An invitation sent in the app itself is not one."
  latestInvite: AccountChange
}

"Since when someone has had an account, as far as the sources know: when they granted access; before the log began, for a grant older than the log; otherwise when a scan first saw the account."
type Since {
  at: DateTime!
  "The grant is older than the log, which began at `at`; false says nothing more about how exact `at` is."
  before: Boolean!
}

"Whether a person may use their account in an app."
enum AppAccountStatus {
  ACTIVE
  "Suspended in the app; a connected app shows it as Disabled."
  SUSPENDED
}

"Whether the company uses an app."
enum AppStatus {
  "Found by a scan; the owner has not decided yet."
  DISCOVERED
  "The owner says the company uses it, or it is connected."
  APPROVED
  "The owner set it aside."
  IGNORED
}

type AppEdge {
  cursor: String!
  node: App!
}

type AppConnection {
  edges: [AppEdge!]!
  pageInfo: PageInfo!
}

"How many apps have each status."
type AppCounts {
  approved: Int!
  discovered: Int!
  ignored: Int!
}

input AppApproveInput {
  id: ID!
}

input AppIgnoreInput {
  id: ID!
}

input AppUserChangeInput {
  "The id of the AppUser or AccountWithoutPerson. The action is checked again on submit."
  id: ID!
  "SUSPEND, REACTIVATE or REMOVE; an account never offers INVITE."
  action: AccountChangeAction!
  "For a Remove retry, the latest retryable failed Remove for this member and connection. A replacement member requires fresh confirmation."
  retryOf: ID
}

input AppInviteInput {
  "The employee to invite."
  employeeId: ID!
  "The app to invite them to, through its connection."
  appId: ID!
}

input AccountChangeMarkDoneByHandInput {
  "The account change's id."
  id: ID!
}

input SetupFinishInput {
  "The discovered apps the company uses; every other discovered app is ignored."
  approvedAppIds: [ID!]!
}

"A personal account with no employee in an approved app. After the app’s first completed scan, only accounts its last scan returned qualify."
type AccountWithoutPerson {
  id: ID!
  email: String!
  "The member's name, when its connection has reported one."
  displayName: String
  app: App!
  "Whether the account may be used in the app."
  status: AppAccountStatus!
  "SUSPEND (Disable) or REACTIVATE (Enable) when the owner may ask for it now, as on AppUser; null otherwise."
  offeredChange: AccountChangeAction
  "Whether the owner may ask for REMOVE now, as on AppUser."
  offersRemove: Boolean!
  "Its latest Disable, Enable or Remove; null before the first."
  latestChange: AccountChange
}

type AccountWithoutPersonEdge {
  cursor: String!
  node: AccountWithoutPerson!
}

type AccountWithoutPersonConnection {
  edges: [AccountWithoutPersonEdge!]!
  pageInfo: PageInfo!
}

enum MarkedAccountKind {
  SERVICE
  EXTERNAL
}

type MarkedAccount {
  id: ID!
  email: String!
  app: App!
  kind: MarkedAccountKind!
  "The owner’s note, or the computed Integration user label for an automatic service account."
  note: String
  "Whether the owner can edit this note."
  canEdit: Boolean!
}

type MarkedAccountEdge {
  cursor: String!
  node: MarkedAccount!
}

type MarkedAccountConnection {
  edges: [MarkedAccountEdge!]!
  pageInfo: PageInfo!
}

input AppAccountMarkInput {
  appAccountId: ID!
  kind: MarkedAccountKind!
  "The owner’s note, at most 500 characters. Surrounding whitespace is trimmed. A note with nothing to read is refused."
  note: String!
}

input AppAccountNoteInput {
  appAccountId: ID!
  "The owner’s note, at most 500 characters. Surrounding whitespace is trimmed. A note with nothing to read is refused."
  note: String!
}

type MarkedAccountPayload {
  account: MarkedAccount
  error: MarkedAccountError
}

union MarkedAccountError = InvalidInputError | ConflictError | NotFoundError

input AppAccountLinkInput {
  appAccountId: ID!
  employeeId: ID!
}

type AppAccountLinkPayload {
  appUser: AppUser
  error: AppAccountLinkError
}

union AppAccountLinkError = NotFoundError | ConflictError

type AppsMutations {
  "Marks a personal account eligible for accountsWithoutPerson with the owner's note. Owner only."
  markAccount(input: AppAccountMarkInput!): MarkedAccountPayload!
  "Edits the note of an account marked by the owner. Owner only."
  editAccountNote(input: AppAccountNoteInput!): MarkedAccountPayload!
  "Links an eligible account to an employee. The link survives a rescan of the same app and email. A new unmatched address needs a new link. Owner only."
  linkAccount(input: AppAccountLinkInput!): AppAccountLinkPayload!
  "Approves an app and records it in the app's history. Admins only."
  approve(input: AppApproveInput!): AppApprovePayload!
  "Ignores an app and records it in the app's history; refused with a ConflictError for a connected app, which stays approved. Admins only."
  ignore(input: AppIgnoreInput!): AppIgnorePayload!
  "Setup's last step: approves the selected discovered apps, ignores the others and finishes setup. Refused with a ConflictError at another step, and as invalid `approvedAppIds` for an id that is no discovered app. Admins only."
  finishSetup(input: SetupFinishInput!): SetupFinishPayload!
  "Disables, enables or removes an app account: queues the change, which runs on the server one per connection at a time, in the order asked, and returns the linked employee's appUser with it as its latest change; appUser is null for an unlinked account or one the change removed. Refused with a NotFoundError for an unknown account, and a ConflictError when the account does not offer this action now (`offeredChange` or `offersRemove`). Admins only."
  changeAccount(input: AppUserChangeInput!): AppUserChangePayload!
  "Invites an employee to an app they have no account in: queues the invite like a Disable, and returns their invite row with it as its latest invite. The app sends its own invitation; an email that already has a member or an invitation gets none. Refused with a NotFoundError for an unknown employee or app, and a ConflictError when the row does not offer Invite now (`offered`). Admins only."
  inviteEmployee(input: AppInviteInput!): AppInvitePayload!
  "I did it by hand: the owner reports making a failed change in the app themselves; Broccoli Access calls no app. The change becomes DONE_BY_HAND and the status Broccoli Access records for the account takes the new value at once, with a history line unless it already had that status; the next scan checks it. A removal immediately deletes the local account unless another source still finds it, in which case it remains listed as outside the app. A failed invite becomes DONE_BY_HAND, which shows the employee Invited. Refused with a NotFoundError for an unknown change, and with a ConflictError unless the change failed and is the latest: its account's latest change, or for an invite, the latest invite of its connection and email. Admins only."
  markAccountChangeDoneByHand(
    input: AccountChangeMarkDoneByHandInput!
  ): AccountChangeMarkDoneByHandPayload!
}

"The approved app, or why it was refused."
type AppApprovePayload {
  app: App
  error: AppApproveError
}

union AppApproveError = NotFoundError

"The ignored app, or why it was refused."
type AppIgnorePayload {
  app: App
  error: AppIgnoreError
}

union AppIgnoreError = NotFoundError | ConflictError

"The account with its change queued, or why the change was refused; appUser is null when the account has no employee or removal has already deleted it."
type AppUserChangePayload {
  appUser: AppUser
  error: AppUserChangeError
}

union AppUserChangeError = NotFoundError | ConflictError

"The account with its change done by hand, or why it was refused; appUser is null for an unlinked or deleted account and for an invite."
type AccountChangeMarkDoneByHandPayload {
  appUser: AppUser
  "The change, now DONE_BY_HAND."
  accountChange: AccountChange
  error: AccountChangeMarkDoneByHandError
}

union AccountChangeMarkDoneByHandError = NotFoundError | ConflictError

"The employee's invite row with the invite queued, or why it was refused."
type AppInvitePayload {
  appInvite: AppInvite
  error: AppInviteError
}

union AppInviteError = NotFoundError | ConflictError

"Setup once finished, or why it was refused."
type SetupFinishPayload {
  setup: Setup
  error: SetupFinishError
}

union SetupFinishError = InvalidInputError | ConflictError

# Adds the app to a template's app; the server merges the types of the modules.
type PersonApp {
  app: App!
}

type TemplateApp {
  "The app the template lists."
  app: App!
}

type Query {
  "Eligible accounts without a person, by email. After an app’s first completed scan, its last scan must have returned the account. Owner only."
  accountsWithoutPerson(first: Int = 100, after: String): AccountWithoutPersonConnection!
  "How many accounts qualify for accountsWithoutPerson. Owner only."
  accountsWithoutPersonCount: Int!
  "Unlinked service and external accounts in approved apps, by email. After an app’s first successful scan, its last scan must have listed the account. Owner only."
  markedAccounts(first: Int = 100, after: String): MarkedAccountConnection!
  "One app; null when there is none. Admins only."
  app(id: ID!): App
  "The apps with a status, the most people first, one page at a time. Admins only."
  apps(status: AppStatus!, "Page size, 1 to 10000." first: Int = 100, after: String): AppConnection!
  "How many apps have each status. Admins only."
  appCounts: AppCounts!
  "One Disable, Enable, Remove or Invite; null when there is none. Admins only."
  accountChange(id: ID!): AccountChange
  "Every Disable, Enable, Remove and Invite, newest first, one page at a time. Admins only."
  accountChanges("Page size, 1 to 10000." first: Int = 100, after: String): AccountChangeConnection!
}

type Mutation {
  apps: AppsMutations!
}

"One invite role from an app's connector manifest."
type AppRole {
  key: String!
  name: String!
  isDefault: Boolean!
}
