enum MarkedAccountKind {
  SERVICE
  EXTERNAL
}

type MarkedAccount {
  id: ID!
  email: String!
  app: App!
  kind: MarkedAccountKind!
  "The owner’s note, or the computed Integration user label for an automatic service account."
  note: String
  "Whether the owner can edit this note."
  canEdit: Boolean!
}

