# Adds Google Workspace to setup; the server merges the `Setup` types of the modules.
type Setup {
  "Where Google sends the admin back after consent; the admin registers it as their Google app's redirect address."
  googleRedirectAddress: String!
  "Whether this instance can connect through the shared Broccoli Google app."
  broccoliGoogleAppAvailable: Boolean!
  "The connected Google organisation's name, which the sign-in page shows; null before Google Workspace is connected."
  organizationName: String
  "The connected Google organisation's primary domain, such as `acme.example`, which the sign-in page shows; null before Google Workspace is connected."
  organizationDomain: String
  "The Google Workspace connection; null before it exists. Owner only, though the rest of `Setup` is public."
  googleWorkspace: GoogleWorkspaceConnection
  "The integration user; null before the owner creates it. Owner only, though the rest of `Setup` is public."
  integrationUser: IntegrationUser
}

"The connected Google Workspace and the Google app it uses."
type GoogleWorkspaceConnection {
  id: ID!
  googleApp: GoogleApp!
  "The Google app used by this connection; never a secret."
  clientId: String!
  "The workspace's primary domain, such as `acme.example`."
  domain: String!
  organizationName: String!
  "The super admin who connected it."
  adminEmail: String!
  "Whether the admin allowed creating and changing the directory's users, which setup's consent does not ask for."
  canChangeUsers: Boolean!
}

"The Google Workspace user Broccoli Access created for itself, which connectors act as. Its password and two-step secret are never returned."
type IntegrationUser {
  "The directory's id for it."
  id: ID!
  email: String!
  "Where signing in to Google as it stands."
  signInStatus: IntegrationUserSignInStatus!
  "Why signing in needs the owner; set exactly when `signInStatus` is `SIGN_IN_NEEDS_OWNER`."
  signInFailure: IntegrationUserSignInFailure
}

enum IntegrationUserSignInStatus {
  "Broccoli Access is signing in to Google as it and setting up its two-step sign-in."
  SETTING_UP_TWO_STEP_SIGN_IN
  "Its two-step sign-in is on and Broccoli Access holds the secret."
  SIGNS_IN_WITH_TWO_STEP_SIGN_IN
  "The last attempt failed or never finished; the owner tries again."
  SIGN_IN_NEEDS_OWNER
}

enum IntegrationUserSignInFailure {
  "Google showed a CAPTCHA or another check, which Broccoli Access never gets around."
  BLOCKED_BY_CHECK
  "Google refused its password or two-step code."
  AUTHENTICATION_FAILED
  "The connectors container, whose browser signs in, did not answer or is not configured."
  CONNECTORS_CONTAINER_UNAVAILABLE
  "The attempt ended another way, or its reason is no longer known, such as after a restart."
  SIGN_IN_DID_NOT_FINISH
}

type GoogleMutations {
  "Starts signing in to Google as the integration user again, unless an attempt runs, and returns the user as it is right then, not the attempt's result: read `signInStatus` again for how it ends. Owner only."
  signInAsIntegrationUser: IntegrationUserMutationPayload!
}

"The integration user after a change."
type IntegrationUserMutationPayload {
  integrationUser: IntegrationUser
}

type Mutation {
  google: GoogleMutations!
}

enum GoogleApp {
  OWN_GOOGLE_APP
  BROCCOLI_GOOGLE_APP
}
