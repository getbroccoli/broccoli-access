# Adds Google Workspace to setup; the server merges the `Setup` types of the modules.
type Setup {
  "Where Google sends the admin back after consent; the admin registers it as their Google app's redirect address."
  googleRedirectAddress: String!
  "Whether this instance can connect through the shared Broccoli Google app."
  broccoliGoogleAppAvailable: Boolean!
  "The connected Google organisation's name, which the sign-in page shows; null before Google Workspace is connected."
  organizationName: String
  "The connected Google organisation's primary domain, such as `acme.example`, which the sign-in page shows; null before Google Workspace is connected."
  organizationDomain: String
  "The Google Workspace connection; null before it exists. Owner only, though the rest of `Setup` is public."
  googleWorkspace: GoogleWorkspaceConnection
  "The integration user; null before the owner creates it. Owner only, though the rest of `Setup` is public."
  integrationUser: IntegrationUser
}

"The connected Google Workspace and the Google app it uses."
type GoogleWorkspaceConnection {
  id: ID!
  googleApp: GoogleApp!
  "The Google app used by this connection; never a secret."
  clientId: String!
  "The workspace's primary domain, such as `acme.example`."
  domain: String!
  organizationName: String!
  "The super admin who connected it."
  adminEmail: String!
  "Whether the admin allowed creating and changing the directory's users, which setup's consent does not ask for."
  canChangeUsers: Boolean!
}

"The Google Workspace user Broccoli Access created for itself, which connectors act as. Its password is never returned."
type IntegrationUser {
  "The directory's id for it."
  id: ID!
  email: String!
}

enum GoogleApp {
  OWN_GOOGLE_APP
  BROCCOLI_GOOGLE_APP
}
