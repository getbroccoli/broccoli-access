# Adds the scans to the Google Workspace connection; the server merges the types of the modules.
type GoogleWorkspaceConnection {
  "The connection's scans: the one running, or the last one's outcome; null before the first."
  scan: Scan
}

# Adds the scans to the connectors module's connections.
type ContainerConnection {
  "The connection's scans: the one running, or the last one's outcome; null before the first."
  scan: Scan
  "The email of the member whose key or session the connection uses, from its last successful scan; null before one."
  connectionUserEmail: String
}

"The scans of one connected app: the one running, or the last one's outcome."
type Scan {
  "The import source the scans read into."
  id: ID!
  "What the UI calls the source: the Google domain, or the connected app's workspace name, such as `Acme`."
  sourceName: String!
  status: ScanStatus!
  "Why the last scan failed; null unless `status` is `SCAN_FAILED`."
  failure: ScanFailure
  "When the last successful scan finished; null before one."
  readAt: DateTime
  "Reading the connection's people: the directory's, or the members an app's scan returned."
  people: ScanPeopleStep!
  "Finding the apps people signed in to with the directory's accounts; an app's scan finds no other apps, and its step reads done with 0."
  apps: ScanAppsStep!
  "Reading the sign-in logs that date when people granted the apps access; an app's scan reads none, and its step follows the people's."
  signInLogs: ScanSignInLogsStep!
}

"Where a connection's scan is."
enum ScanStatus {
  "A scan is queued or running; the last successful scan's results stay until it finishes."
  SCANNING
  "The last scan finished and its results are saved."
  SCANNED
  "The last scan failed; the results of the one before stay."
  SCAN_FAILED
}

"Why a scan failed, as the connected app answered."
enum ScanFailure {
  "The app refused the connection's credentials, such as a revoked or expired token."
  AUTHENTICATION_FAILED
  "A permission or an admin right is missing."
  PERMISSION_MISSING
  "The app kept limiting requests after the scan tried again."
  RATE_LIMITED
  "The app timed out or failed after the scan tried again."
  APP_UNAVAILABLE
  "The app answered something the connector does not understand."
  UNEXPECTED_RESPONSE
  "A CAPTCHA, bot check or MFA prompt stopped the connector."
  BLOCKED_BY_CHECK
  "No single member matched."
  ACCOUNT_NOT_FOUND
  "The key or session reaches another workspace than the connection's."
  WRONG_WORKSPACE
  "The app refused the change."
  NOT_ALLOWED
  "The owner's Chrome went away during the call."
  OWNER_BROWSER_LOST
}

"Reading the connection's people during a scan."
type ScanPeopleStep {
  state: ScanStepState!
  "How many people the directory holds, or how many members the app returned; null until the step is done."
  count: Int
  "How many of them are suspended; null until the step is done."
  suspended: Int
}

"Finding the apps people signed in to during a scan."
type ScanAppsStep {
  state: ScanStepState!
  "How many apps people signed in to; null until the step is done."
  count: Int
}

"Reading the sign-in logs during a scan."
type ScanSignInLogsStep {
  state: ScanStepState!
}

"Where one step of a scan is."
enum ScanStepState {
  "The step waits while the directory's people are read."
  WAITING
  "The step is running."
  RUNNING
  "The step finished."
  DONE
  "The scan failed."
  FAILED
}

type ImportsMutations {
  "Scan now: queues a scan of the connection, or nothing more while one is queued or running. Admins only."
  scanConnection(connectionId: ID!): ScanMutationPayload!
}

"The scan after a change."
type ScanMutationPayload {
  scan: Scan
}

type Mutation {
  imports: ImportsMutations!
}
