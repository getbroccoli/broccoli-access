query ChromeExtension {
  me {
    id
    extensionPairing {
      id
      browser
      pairedAt
    }
  }
}

mutation StartExtensionPairing {
  extension {
    startPairing {
      code
    }
  }
}

mutation UnpairExtension {
  extension {
    unpair {
      user {
        id
        extensionPairing {
          id
        }
      }
    }
  }
}
