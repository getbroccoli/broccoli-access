query PersonPage($id: ID!) {
  employee(id: $id) {
    id
    firstName
    lastName
    email
    avatarUrl
    status
    suspendedWithAccess
    approvedAppNames
    templates {
      id
      name
    }
    templateApps {
      app {
        id
        name
        catalogKey
      }
      templates {
        id
        name
      }
      role
      state
    }
    appAccounts {
      id
      status
      foundVia
      since {
        at
        before
      }
      app {
        id
        name
        catalogKey
        canChangeAccounts
      }
      latestChange {
        id
        status
      }
      ...AccountChangeCell_appUser
      ...AppAccountStatusCell_appUser
    }
    appInvites {
      id
      invitedAt
      app {
        id
        name
        catalogKey
      }
      latestInvite {
        id
        status
      }
      ...InviteCell_appInvite
      ...InviteStatusCell_appInvite
    }
  }
  # As on the Templates page, the selector lists up to 10,000 templates by name.
  templates(first: 10000) {
    edges {
      node {
        id
        name
      }
    }
  }
}

mutation AssignTemplate($input: TemplateAssignInput!) {
  templates {
    assign(input: $input) {
      template {
        id
        peopleCount
      }
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}

mutation TakeOffTemplate($input: TemplateTakeOffInput!) {
  templates {
    takeOff(input: $input) {
      template {
        id
        peopleCount
      }
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}
