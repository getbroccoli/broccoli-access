query PersonPage($id: ID!) {
  employee(id: $id) {
    id
    firstName
    lastName
    email
    avatarUrl
    status
    suspendedWithAccess
    approvedAppNames
    appAccounts {
      id
      status
      foundVia
      since {
        at
        before
      }
      app {
        id
        name
        catalogKey
        canChangeAccounts
      }
      latestChange {
        id
        status
      }
      ...AccountChangeCell_appUser
      ...AppAccountStatusCell_appUser
    }
    appInvites {
      id
      app {
        id
        name
        catalogKey
      }
      latestInvite {
        id
        status
      }
      ...InviteCell_appInvite
      ...InviteStatusCell_appInvite
    }
  }
}
