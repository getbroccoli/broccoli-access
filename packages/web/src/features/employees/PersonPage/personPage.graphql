        ... on Error {
          message
        }
      }
    }
  }
}

# shortcut: reads up to 10,000 approved apps at once for "Add app"; search them once a company
# approves more.
query PersonAppOptions($employeeId: ID!) {
  employee(id: $employeeId) {
    id
    personApps(first: 10000) {
      edges {
        node {
          choice
          app {
            id
          }
          templates {
            id
          }
        }
      }
    }
  }
  apps(status: APPROVED, first: 10000) {
    edges {
      node {
        id
        name
        catalogKey
        connected
        roles {
          key
          name
          isDefault
        }
      }
    }
  }
}

