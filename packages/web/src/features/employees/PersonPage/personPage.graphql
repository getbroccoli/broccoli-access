query PersonPage($id: ID!, $templatesAfter: String, $appsAfter: String) {
  employee(id: $id) {
    id
    firstName
    lastName
    email
    avatarUrl
    status
    suspendedWithAccess
    approvedAppNames
    templates(first: 30, after: $templatesAfter) {
      pageInfo {
        hasNextPage
        endCursor
      }
      edges {
        node {
          id
          name
        }
      }
    }
    personApps(first: 30, after: $appsAfter) {
      pageInfo {
        hasNextPage
        endCursor
      }
      edges {
        node {
          accountStatus
          app {
            id
            name
            catalogKey
            connected
            roles {
              key
              name
              isDefault
            }
          }
          templates {
            id
            name
          }
          roleConflict
          roleSources {
            role
            template {
              id
              name
            }
          }
          role
          choice
          state
        }
      }
    }
    appAccounts {
      email
      offeredChange
      id
      status
      foundVia
      since {
        at
        before
      }
      app {
        id
        name
        catalogKey
        canChangeAccounts
      }
      latestChange {
        action
        id
        status
      }
      ...AccountChangeCell_appUser
      ...AppAccountStatusCell_appUser
    }
    # The same fields as `appAccounts`, so its row joins theirs.
    directoryAccount {
      email
      offeredChange
      id
      status
      foundVia
      since {
        at
        before
      }
      app {
        id
        name
        catalogKey
        canChangeAccounts
      }
      latestChange {
        action
        id
        status
      }
      ...AccountChangeCell_appUser
      ...AppAccountStatusCell_appUser
    }
    offboarding {
      offboardedAt
      accountsToDisable {
        id
        app {
          id
          name
          catalogKey
        }
      }
      byHandWork {
        reason
        app {
          id
          name
        }
      }
    }
    appInvites {
      id
      invitedAt
      app {
        id
        name
        catalogKey
      }
      latestInvite {
        id
        status
      }
      ...InviteCell_appInvite
      ...InviteStatusCell_appInvite
    }
  }
}

query AssignableTemplates($employeeId: ID!, $after: String) {
  templates(first: 12, after: $after, assignableTo: $employeeId) {
    edges {
      node {
        id
        name
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

mutation AssignTemplate($input: TemplateAssignInput!) {
  templates {
    assign(input: $input) {
      template {
        id
        peopleCount
      }
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}

mutation TakeOffTemplate($input: TemplateTakeOffInput!) {
  templates {
    takeOff(input: $input) {
      template {
