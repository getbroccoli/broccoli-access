query PeoplePage($filter: EmployeeFilter, $skipPeople: Boolean! = false) {
  employeeCounts {
    all
    suspendedWithAccess
  }
  employees(first: 10000, orderBy: { field: STATUS }, filter: $filter) @skip(if: $skipPeople) {
    edges {
      node {
        id
        firstName
        lastName
        email
        avatarUrl
        status
        approvedAppNames
      }
    }
  }
}

query AddPersonForm {
  setup {
    id
    googleWorkspace {
      id
      domain
      canChangeUsers
      googleApp
    }
  }
}

query AddPersonTemplates($after: String) {
  templates(first: 50, after: $after) {
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        id
        name
        apps {
          id
          role
          app {
            id
            name
            catalogKey
            containerConnection {
              id
            }
          }
        }
      }
    }
  }
}

mutation AddPerson($input: AddPersonInput!) {
  apps {
    addPerson(input: $input) {
      employee {
        id
      }
      error {
        __typename
        ... on Error {
          message
        }
        ... on InvalidInputError {
          fields {
            field
            code
          }
        }
      }
    }
  }
}

mutation LinkAccount($input: AppAccountLinkInput!) {
  apps {
    linkAccount(input: $input) {
      appUser {
        id
      }
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}

query PeopleToLink($search: String, $after: String) {
  employees(first: 50, after: $after, filter: { search: $search }) {
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        id
        email
        firstName
        lastName
      }
    }
  }
}

query AccountsWithoutPersonCount {
  accountsWithoutPersonCount
}

query AccountsWithoutPerson($after: String, $first: Int = 100) {
  accountsWithoutPerson(after: $after, first: $first) {
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        id
        email
        displayName
        status
        offeredChange
        offersRemove
        latestChange {
          id
          action
          status
          changesAhead
          failure
          finishedAt
        }
        app {
          id
          name
          containerConnection {
            adminUrl
            id
            # shortcut: reads each connection's scan for the workspace name the Remove dialog shows;
            # read it when the dialog opens once the list spans many connected apps.
            scan {
              id
              sourceName
              readAt
            }
          }
        }
        suggestedEmployee {
          id
          firstName
          lastName
          email
        }
      }
    }
  }
}

query MarkedAccounts($after: String, $first: Int = 100) {
  markedAccounts(after: $after, first: $first) {
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        id
        email
        kind
        note
        canEdit
        app {
          id
          name
        }
      }
    }
  }
}

mutation MarkAccount($input: AppAccountMarkInput!) {
  apps {
    markAccount(input: $input) {
      account {
        id
      }
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}

mutation EditAccountNote($input: AppAccountNoteInput!) {
  apps {
    editAccountNote(input: $input) {
      account {
        id
        note
      }
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}

# What a failed change's dialog shows. The list is read without the cache, which masks fragments
# away, so the row of a failed change reads them here.
query UnlinkedAccountChange($id: ID!) {
  accountChange(id: $id) {
    id
    ...CouldntChangeDialog_accountChange
  }
}
