query PeopleDifferences($showDifferences: Boolean!) {
  accessDifferences {
    missingCount
    extraCount
    missing @include(if: $showDifferences) {
      app {
        id
        name
      }
      employee {
        id
        firstName
        lastName
      }
      provisionStep {
        action
      }
      provisioning
    }
    extra @include(if: $showDifferences) {
      app {
        id
        name
      }
      employee {
        id
        firstName
        lastName
      }
      activeAccounts {
        id
        latestChange {
          id
          status
        }
        ...AccountChangeCell_appUser
      }
    }
  }
}

mutation KeepExtraApp($input: ExtraAppKeepInput!) {
  templates {
    keepExtraApp(input: $input) {
      employee {
        id
      }
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}
