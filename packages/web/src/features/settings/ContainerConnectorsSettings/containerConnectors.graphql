query ContainerConnectorsSettings {
  containerConnectors {
    id
    name
    connectionFields {
      kind
      label
      secret
    }
    ...ConnectContainerConnectorDialog_connector
    ...ConnectAppSessionDialog_connector
    ...ReconnectButton_connector
    connection {
      id
      status
      reconnectReason {
        cause
        foundAt
        foundByChange {
          id
          action
          email
          employee {
            id
            firstName
            lastName
          }
        }
      }
      connectionUserEmail
      noticeAcceptedAt
      scan {
        id
        status
        readAt
        sourceName
        people {
          count
        }
      }
    }
  }
}
