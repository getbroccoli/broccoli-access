query ContainerConnectorsSettings {
  containerConnectors {
    id
    name
    appDomain
    notice
    connectionFields {
      kind
      label
      secret
    }
    ...ConnectContainerConnectorDialog_connector
    connection {
      id
      connectionUserEmail
      noticeAcceptedAt
      scan {
        id
        status
        readAt
        sourceName
        people {
          count
        }
      }
    }
  }
}

query AppSessionHandOver($id: ID!) {
  appSessionHandOver(id: $id) {
    id
    organizationName
    domain
    appSession
  }
}
