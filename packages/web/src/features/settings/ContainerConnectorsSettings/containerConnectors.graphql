query ContainerConnectorsSettings {
  containerConnectors {
    id
    name
    connectionFields {
      kind
      label
      secret
    }
    ...ConnectContainerConnectorDialog_connector
    connection {
      id
      connectionUserEmail
      scan {
        id
        status
        readAt
        sourceName
        people {
          count
        }
      }
    }
  }
}
