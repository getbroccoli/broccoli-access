query ConnectionsSettings {
  setup {
    id
    googleWorkspace {
      id
      googleApp
      clientId
      domain
      adminEmail
      canChangeUsers
      scan {
        id
        status
        failure
        readAt
      }
    }
    integrationUser {
      id
      email
      signInStatus
      signInFailure
    }
  }
}

mutation SignInAsIntegrationUser {
  google {
    signInAsIntegrationUser {
      integrationUser {
        id
        signInStatus
        signInFailure
      }
    }
  }
}
