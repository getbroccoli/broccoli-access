fragment ConnectAppSessionDialog_connector on ContainerConnector {
  id
  name
  appDomain
  notice
  signsInAsIntegrationUser
  # Once connected, the dialog offers Switch for the owner's own session.
  connection {
    id
    sessionFrom
  }
}

query ConnectWayIntegrationUser {
  setup {
    id
    integrationUser {
      id
      email
      signInStatus
    }
  }
}

# Returns what connecting or switching changes: the connection, whose session it uses and its scan.
mutation ConnectWithIntegrationUser($input: ContainerConnectorConnectWithIntegrationUserInput!) {
  connectors {
    connectWithIntegrationUser(input: $input) {
      # A first connection waits here until the owner confirms the workspace the sign-in reached.
      appSessionHandOver {
        id
        organizationName
        domain
        appSession
      }
      containerConnector {
        id
        connection {
          id
          status
          reconnectReason {
            cause
          }
          sessionFrom
          connectionUserEmail
          noticeAcceptedAt
          scan {
            id
            status
            readAt
            sourceName
            people {
              count
            }
          }
          # What signing in again changes in the people's offers, as the other Reconnect returns it.
          app {
            id
            users {
              id
              offeredChange
              offersRemove
              offersReconnect
            }
          }
        }
      }
      error {
        __typename
        ... on Error {
          message
        }
        ... on InvalidInputError {
          fields {
            field
            code
          }
        }
      }
    }
  }
}

query AppSessionHandOver($id: ID!) {
  appSessionHandOver(id: $id) {
    id
    organizationName
    domain
    appSession
  }
}
