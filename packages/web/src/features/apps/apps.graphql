query AppsPage($status: AppStatus!, $first: Int!) {
  appCounts {
    approved
    discovered
    ignored
  }
  apps(status: $status, first: $first) {
    edges {
      node {
        id
        name
        domain
        catalogKey
        status
        connected
        peopleCount
        # The avatars a row shows before "+N".
        users(first: 4) {
          id
          employee {
            id
            firstName
            lastName
            email
            avatarUrl
          }
        }
        suspendedWithAccessCount
        foundVia
        since {
          at
          before
        }
        preselected
      }
    }
  }
}

query AppsScan {
  setup {
    id
    googleWorkspace {
      id
      scan {
        id
        status
        readAt
      }
    }
  }
}

mutation ApproveApp($input: AppApproveInput!) {
  apps {
    approve(input: $input) {
      app {
        id
        status
      }
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}

mutation IgnoreApp($input: AppIgnoreInput!) {
  apps {
    ignore(input: $input) {
      app {
        id
        status
      }
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}

mutation FinishSetup($input: SetupFinishInput!) {
  apps {
    finishSetup(input: $input) {
      setup {
        id
        step
      }
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}
