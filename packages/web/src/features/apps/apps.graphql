# `approved` reads what only the Approved tab shows, which waits for the connectors container.
query AppsPage($status: AppStatus!, $first: Int!, $approved: Boolean!) {
  appCounts {
    approved
    discovered
    ignored
  }
  apps(status: $status, first: $first) {
    edges {
      node {
        # Tells the Approved tab's apps from its apps to connect.
        __typename
        id
        name
        domain
        catalogKey
        status
        connected
        peopleCount
        # The avatars a row shows before "+N"; accounts not in the app come last.
        users: peoplePreview(first: 4) {
          id
          inApp
          employee {
            id
            firstName
            lastName
            email
            avatarUrl
          }
        }
        suspendedWithAccessCount
        foundVia
        since {
          at
          before
        }
        preselected
        managingConnector @include(if: $approved) {
          id
          connection {
            id
          }
          ...ConnectAppButton_connector
        }
      }
    }
  }
  # Computed rows the Approved tab lists after its apps.
  appsToConnect @include(if: $approved) {
    __typename
    id
    name
    domain
    connector {
      id
      connection {
        id
      }
      ...ConnectAppButton_connector
    }
  }
}

query AppsScan {
  setup {
    id
    googleWorkspace {
      id
      scan {
        id
        status
        readAt
      }
    }
  }
}

mutation ApproveApp($input: AppApproveInput!) {
  apps {
    approve(input: $input) {
      app {
        id
        status
      }
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}

mutation IgnoreApp($input: AppIgnoreInput!) {
  apps {
    ignore(input: $input) {
      app {
        id
        status
      }
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}

mutation FinishSetup($input: SetupFinishInput!) {
  apps {
    finishSetup(input: $input) {
      setup {
        id
        step
      }
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}
