mutation ConnectContainerConnector($input: ContainerConnectorConnectInput!) {
  connectors {
    connect(input: $input) {
      containerConnector {
        id
        connection {
          id
          connectionUserEmail
          scan {
            id
            status
            readAt
            sourceName
            people {
              count
            }
          }
        }
      }
      error {
        __typename
        ... on Error {
          message
        }
        ... on InvalidInputError {
          fields {
            field
            code
          }
        }
      }
    }
  }
}
