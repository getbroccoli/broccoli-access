# The failed change with the row it may act on, read each time the owner opens it.
query ActivityFailedChange($id: ID!) {
  accountChange(id: $id) {
    id
    action
    status
    ...CouldntChangeDialog_accountChange
    app {
      id
    }
    appUser {
      id
      status
      offeredChange
      offersRemove
      latestChange {
        id
      }
      app {
        id
        containerConnection {
          id
          connector {
            id
            canDisableAccounts
          }
        }
      }
    }
    employee {
      id
      appInvites {
        id
        app {
          id
        }
        offered
        invitedAt
        latestInvite {
          id
        }
      }
      personApps(first: 10000) {
        edges {
          node {
            role
            roleConflict
            app {
              id
              roles {
                key
              }
            }
          }
        }
      }
    }
  }
}
