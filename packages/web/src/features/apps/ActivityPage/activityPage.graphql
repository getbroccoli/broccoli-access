# shortcut: reads up to 10,000 changes at once, newest first; page with `after` once an instance
# keeps more.
query ActivityPage {
  accountChanges(first: 10000) {
    edges {
      node {
        id
        action
        startedFrom
        status
        changesAhead
        failure
        email
        requestedAt
        finishedAt
        requestedBy {
          id
          name
        }
        app {
          id
          name
          catalogKey
        }
        employee {
          id
          firstName
          lastName
          email
          avatarUrl
        }
        ...CouldntChangeDialog_accountChange
      }
    }
  }
}
