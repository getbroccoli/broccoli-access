query AppPage($id: ID!) {
  app(id: $id) {
    id
    name
    domain
    catalogKey
    status
    connected
    canChangeAccounts
    peopleCount
    suspendedWithAccessCount
    managingConnector {
      id
      connection {
        id
      }
      ...ConnectAppButton_connector
    }
    containerConnection {
      id
      adminUrl
      status
      sessionFrom
      integrationUserSuspended
      reconnectReason {
        cause
      }
      connectionUserEmail
      connector {
        id
        name
        connectionFields {
          kind
        }
        ...ReconnectButton_connector
      }
      scan {
        id
        status
        readAt
        sourceName
      }
    }
    users {
      email
      id
      status
      inApp
      isConnectionUser
      latestChange {
        id
        status
      }
      ...AccountChangeCell_appUser
      ...AppAccountStatusCell_appUser
      foundVia
      since {
        at
        before
      }
      employee {
        id
        firstName
        lastName
        email
        avatarUrl
        status
      }
    }
  }
}

# Polled while a connected app's scan runs, reading scans only; the users reload once when it ends.
