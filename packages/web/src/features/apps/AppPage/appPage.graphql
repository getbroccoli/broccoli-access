query AppPage($id: ID!) {
  app(id: $id) {
    id
    name
    domain
    catalogKey
    status
    connected
    canChangeAccounts
    peopleCount
    suspendedWithAccessCount
    managingConnector {
      id
      connection {
        id
      }
      ...ConnectAppButton_connector
    }
    containerConnection {
      id
      adminUrl
      connector {
        id
        findingKind
      }
      scan {
        id
        status
        readAt
        sourceName
      }
    }
    users {
      id
      status
      isConnectionUser
      latestChange {
        id
        status
      }
      ...AccountChangeCell_appUser
      foundVia
      since {
        at
        before
      }
      employee {
        id
        firstName
        lastName
        email
        avatarUrl
        status
      }
    }
  }
}

# Polled while a connected app's scan runs, reading scans only; the users reload once when it ends.
query AppConnectionScan {
  containerConnectors {
    id
    connection {
      id
      scan {
        id
        status
        readAt
        sourceName
      }
    }
  }
}
