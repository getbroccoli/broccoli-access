query AppPage($id: ID!) {
  app(id: $id) {
    id
    name
    domain
    catalogKey
    status
    connected
    peopleCount
    suspendedWithAccessCount
    users {
      id
      foundVia
      since {
        at
        before
      }
      employee {
        id
        firstName
        lastName
        email
        avatarUrl
        status
      }
    }
  }
}
