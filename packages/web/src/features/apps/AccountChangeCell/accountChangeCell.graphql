fragment AccountChangeCell_appUser on AppUser {
  email
  id
  status
  isConnectionUser
  offeredChange
  offersReconnect
  latestChange {
    id
    action
    status
    changesAhead
    finishedAt
    failure
  }
  employee {
    id
    firstName
    lastName
    email
    avatarUrl
  }
  app {
    id
    name
    catalogKey
    canChangeAccounts
    containerConnection {
      id
      scan {
        id
        sourceName
        readAt
      }
      connector {
        id
        connectionFields {
          key
          label
          secret
        }
        ...ReconnectButton_connector
      }
    }
  }
}

mutation ChangeAccount($input: AppUserChangeInput!) {
  apps {
    changeAccount(input: $input) {
      appUser {
        id
        ...AccountChangeCell_appUser
        ...AppAccountStatusCell_appUser
      }
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}
