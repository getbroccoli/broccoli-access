fragment InviteCell_appInvite on AppInvite {
  id
  offered
  offersReconnect
  invitedAt
  latestInvite {
    id
    action
    status
    changesAhead
    failure
    finishedAt
  }
  employee {
    id
    firstName
    lastName
    email
    avatarUrl
  }
  app {
    id
    name
    catalogKey
    canChangeAccounts
    containerConnection {
      id
      status
      ...AccountChangeActor_connection @unmask
      scan {
        id
        sourceName
        readAt
      }
      connector {
        id
        ...ReconnectButton_connector
      }
    }
  }
}

mutation InviteEmployee($input: AppInviteInput!) {
  apps {
    inviteEmployee(input: $input) {
      appInvite {
        id
        ...InviteCell_appInvite
        ...InviteStatusCell_appInvite
      }
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}
