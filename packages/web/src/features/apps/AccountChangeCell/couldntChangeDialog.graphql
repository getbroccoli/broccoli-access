fragment CouldntChangeDialog_accountChange on AccountChange {
  id
  action
  failure
  finishedAt
  requestedAt
  requestedBy {
    id
    name
  }
  email
  employee {
    id
    firstName
    lastName
  }
  app {
    id
    name
    containerConnection {
      id
      adminUrl
      status
      sessionFrom
      integrationUserSuspended
      connectionUserEmail
      scan {
        id
        status
        sourceName
        readAt
      }
      connector {
        id
        canDisableAccounts
        connectionFields {
          kind
          secret
        }
        ...ReconnectButton_connector
      }
    }
  }
}

mutation MarkAccountChangeDoneByHand($input: AccountChangeMarkDoneByHandInput!) {
  apps {
    markAccountChangeDoneByHand(input: $input) {
      appUser {
        id
        ...AccountChangeCell_appUser
        ...AppAccountStatusCell_appUser
        # What the person page and the app page count of the access left.
        employee {
          id
          suspendedWithAccess
          approvedAppNames
        }
        app {
          id
          suspendedWithAccessCount
        }
      }
      # For an invite: what changes on the employee's invite rows, which now show Invited; their
      # fragments' other fields stay cached, and spreading them would pass the API's depth limit.
      accountChange {
        id
        status
        employee {
          id
          appInvites {
            id
            offered
            offersReconnect
            invitedAt
            latestInvite {
              id
              status
            }
          }
        }
      }
      error {
        __typename
        ... on Error {
          message
        }
      }
    }
  }
}
