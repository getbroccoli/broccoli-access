name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jobs run inside containers so that they share no host ports or file ownership
# with other jobs on the same self-hosted machine.
jobs:
  test:
    name: Test
    runs-on: self-hosted
    container:
      image: node:24.21.0-bookworm
      options: --cpus 4 --memory 8g --memory-swap 8g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs pnpm from packageManager; pnpm then installs Node from devEngines.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          standalone: true
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  e2e:
    name: End-to-end tests
    runs-on: self-hosted
    container:
      image: node:24.21.0-bookworm
      options: --cpus 4 --memory 8g --memory-swap 8g
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: broccoli_access
          # Reachable only on the job network.
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --cpus 2 --memory 2g --memory-swap 2g
          --tmpfs /var/lib/postgresql:size=1g
          --health-cmd "pg_isready -U broccoli_access -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://broccoli_access@postgres:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          standalone: true
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
      # Without the fake connectors' conformance suite, which needs Docker: see below.
      - run: pnpm test:e2e --filter=!@broccoli-access/fake-apps

  conformance:
    name: Connector conformance
    # GitHub-hosted, not the shared self-hosted runner: the suite starts containers, and a Docker
    # socket in a job container would hand the self-hosted machine to any pull request.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          standalone: true
          cache: true
      # Only what the suite needs; the root's postinstall generates code for the other packages.
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @broccoli-access/fake-apps...
      # Builds the fake connectors image and runs the suite against two read-only containers of it.
      - run: pnpm --filter @broccoli-access/fake-apps test:e2e

  publish:
    name: Publish image
    # Only a tested commit on this repository's main: never a pull request or a fork.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'getbroccoli/broccoli-access'
    needs: [test, e2e, conformance]
    # GitHub-hosted, for the Docker socket, as the conformance job.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The label links the package to this repository.
      # shortcut: amd64 only, add arm64 when a self-hoster needs it
      - run: |
          image=ghcr.io/getbroccoli/broccoli-access
          docker build --platform linux/amd64 --file packages/api/Dockerfile \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$image:latest" --tag "$image:sha-${GITHUB_SHA::7}" .
          # No push unless docker-compose.yml's service becomes ready on this image. Postgres only:
          # readiness waits for the migrations, not for the connectors, another repository's image.
          docker compose up --detach --wait postgres
          # Test the image just built: pulling would replace its latest tag with the old release.
          docker compose up --detach --wait --no-deps --pull never broccoli-access || { docker compose logs broccoli-access; exit 1; }
          docker compose down --volumes
          # The commit's tag first, so `latest` never points at an image that cannot be pinned.
          docker push "$image:sha-${GITHUB_SHA::7}"
          docker push "$image:latest"
